name: 'Validate GitHub Deploy Action'
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'plan/**'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
          action: [ deploy, plan ]
    steps:
      - uses: actions/checkout@v7

      - name: Validate ${{ matrix.action }}/action files
        id: validate
        run: |
          npm install -g ajv-cli ajv-formats js-yaml
          curl -fsSL -o action-schema.json https://www.schemastore.org/github-action.json
          echo "Validating against schema..."
          ajv validate \
              --all-errors \
              --verbose \
              -s action-schema.json \
              -d ./${{ matrix.action }}/action.yml || {
                echo "";
                echo "✗ Schema validation failed.";
                exit 1;
              }
          echo "✓ Validation passed!"

      - name: Check ${{ matrix.action }} action dependency pins
        shell: bash
        run: |
          action_file="./${{ matrix.action }}/action.yml"
          pin_status=0

          while IFS= read -r reference; do
            case "$reference" in
              ./* | docker://*) continue ;;
            esac

            if [[ ! "$reference" =~ ^[^@[:space:]]+@[0-9a-f]{40}$ ]]; then
              echo "::error file=$action_file::Action dependency '$reference' must use a full-length commit SHA."
              pin_status=1
            fi
          done < <(sed -nE 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*([^[:space:]#]+).*$/\2/p' "$action_file")

          exit "$pin_status"
